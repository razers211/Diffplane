name: Release images

# A version tag (v1.2.3) builds both images Compose needs for linux/amd64 and linux/arm64, scans
# them, pushes them to GitHub's container registry (tagged with the version and `latest`) with an
# SBOM and build provenance attached, and signs them with cosign (keyless, this workflow's identity).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  images:
    name: Build and push ${{ matrix.name }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write # cosign's keyless signature
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: diffplane-orchestrator
            context: .
            file: orchestrator/Dockerfile
          - name: diffplane-ztp
            context: deploy/ztp
            file: deploy/ztp/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The tag is Compose's default version
        # A release first moves DIFFPLANE_VERSION's default (deploy/compose.yaml and the scripts).
        run: grep -qF "DIFFPLANE_VERSION:-$GITHUB_REF_NAME}" deploy/compose.yaml
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: image
        # The registry wants a lower-case owner.
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - name: Build for the scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          # shortcut: only amd64 is scanned (same package versions as arm64); scan arm64 too if they ever differ.
          platforms: linux/amd64
          load: true
          tags: scan:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
      - name: Image vulnerabilities (fixable HIGH and CRITICAL stop the release before anything is pushed)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          docker.io/aquasec/trivy:0.58.1@sha256:ab70a02200597efa04748f210f793936eb647cbcdb0ea69cc30b226d6f5a22c7
          image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 scan:${{ github.sha }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ${{ steps.image.outputs.ref }}:${{ github.ref_name }}
            ${{ steps.image.outputs.ref }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign
        run: cosign sign --yes "${{ steps.image.outputs.ref }}@${{ steps.build.outputs.digest }}"
