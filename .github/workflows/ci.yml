name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GITLEAKS: ghcr.io/gitleaks/gitleaks:v8.21.2@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46
  TRIVY: docker.io/aquasec/trivy:0.58.1@sha256:ab70a02200597efa04748f210f793936eb647cbcdb0ea69cc30b226d6f5a22c7
  SEMGREP: docker.io/semgrep/semgrep:1.99.0@sha256:ae27024c16f7848cdbfd49c24ed0b78b13f13b85fcd7b87c679aaa8b0c0dce98

jobs:
  python:
    name: Python tests, image scan and SBOM
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the orchestrator image
        run: docker build -t diffplane-orchestrator:ci -f orchestrator/Dockerfile .
      - name: Tests
        run: IMAGE=diffplane-orchestrator:ci scripts/test.sh
      - name: Image vulnerabilities (fixable HIGH and CRITICAL fail the build)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY" image
          --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 diffplane-orchestrator:ci
      - name: SBOM (CycloneDX)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD":/out "$TRIVY" image
          --format cyclonedx --output /out/sbom.cdx.json diffplane-orchestrator:ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json

  gui:
    name: GUI type check, tests, build and audit
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npx vitest run
      - run: npm run build
      - run: npm audit --audit-level=high

  security:
    name: Secrets and static analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks (whole history)
        run: docker run --rm -v "$PWD":/repo "$GITLEAKS" git /repo --redact --exit-code 1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: bandit (high severity, high confidence fail the build)
        run: |
          pip install bandit==1.8.0
          bandit -q -r orchestrator collector flows syslogs sftpd generators rulebook seed deploy tools -lll -iii
      - name: pip-audit (locked dependencies)
        run: |
          pip install pip-audit==2.7.3
          pip-audit --strict --require-hashes --disable-pip -r requirements.lock
      - name: semgrep
        run: >
          docker run --rm -v "$PWD":/src -w /src "$SEMGREP" semgrep scan --metrics=off
          --config p/default --config p/python --config p/dockerfile --exclude gui/node_modules --error
      - name: trivy (dependencies, secrets and misconfiguration in the repository)
        run: >
          docker run --rm -v "$PWD":/src "$TRIVY" fs --scanners vuln,secret
          --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 /src
