name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Security problems: do not file them here**, see SECURITY.md.
        Remove addresses, serial numbers, host keys, passwords and other secrets from anything you paste.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
  - type: input
    id: switch
    attributes:
      label: Switch model and software release (if a switch is involved)
  - type: textarea
    id: logs
    attributes:
      label: Logs or patch (secrets removed)
      render: text
