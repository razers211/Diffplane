[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "diffplane-orchestrator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.2",
    "httpx>=0.28.1",
    "uvicorn>=0.54.0",
    "pyyaml>=6.0.3",
    # Pinned: generator output and patch behaviour depend on the exact Annet rulebook.
    "annet[netbox]==4.6.14",
    "gnetcli_adapter==2.8.5",
    "ncclient==0.7.1",
    "cryptography>=50.0.2",   # config backups encrypted with Fernet; already pulled in by paramiko
    "ldap3==2.9.1",           # Active Directory sign-in over LDAPS
    "pyrad==2.6.0",           # RADIUS sign-in
    "prometheus_client==0.26.0",
    "sqlalchemy[asyncio]==2.1.9",
    "asyncpg==0.32.0",
    "alembic==1.20.1",
]

[project.optional-dependencies]
# pgserver: embedded PostgreSQL for the database tests
test = ["pytest>=9.2.0", "pgserver==0.1.4"]

[tool.setuptools]
packages = ["orchestrator", "orchestrator.routers", "orchestrator.migrations", "orchestrator.migrations.versions", "seed", "generators", "collector", "flows", "syslogs", "sftpd", "rulebook", "rulebook.texts", "rulebook.huawei"]

[tool.setuptools.package-data]
"rulebook.texts" = ["*.rul", "*.order", "*.deploy"]
"orchestrator" = ["radius.dict"]
"orchestrator.migrations" = ["script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
