# Prometheus for the platform: scrapes the read-only collector and the orchestrator's drift
# metrics, evaluates the alert rules and sends firing alerts to Alertmanager.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: collector
    scrape_interval: 5s   # as often as the collector polls counters: irate() needs every sample
    static_configs:
      - targets: ["collector:9108"]
  - job_name: orchestrator
    metrics_path: /metrics
    # HTTPS only; trusts exactly the orchestrator's self-signed certificate (orchestrator/tls.py).
    scheme: https
    tls_config:
      ca_file: /tls-public/fabric.crt
      server_name: orchestrator
    authorization:   # /metrics needs the token (METRICS_TOKEN, a Compose secret)
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ["orchestrator:8000"]
