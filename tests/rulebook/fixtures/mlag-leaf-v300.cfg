# Shape of an M-LAG/EVPN leaf on V300R023, cut down from leaf1's running config
# before its wipe. Secrets removed; one of each kind of block is kept.
dfs-group 1
 dual-active detection source ip 10.1.1.2 peer 10.1.1.1
 priority 120
#
stp mode rstp
stp v-stp enable
#
evpn-overlay enable
#
ip vpn-instance _management_vpn_
 ipv4-family
#
vlan batch 100 2010
#
vlan 100
 description vxlan-bypass
#
bridge-domain 500
 vxlan vni 10500
 #
 evpn
  route-distinguisher auto
  vpn-target 10.180.1.0:10500 export-extcommunity
  vpn-target 10.180.1.0:10500 import-extcommunity
#
aaa
 local-user netconf privilege level 3
 local-user netconf service-type ssh http md-cli
#
interface Vlanif100
 ip address 192.168.20.2 255.255.255.252
 reserved for vxlan bypass
#
interface MEth0/0/0
 ip binding vpn-instance _management_vpn_
 ip address 172.24.0.11 255.255.255.0
#
interface Eth-Trunk0
 description MLAG-PEER-LINK
 mode lacp-static
 peer-link 1
 port vlan exclude 1
#
interface Eth-Trunk1
 port link-type trunk
 undo port trunk allow-pass vlan 1
 mode lacp-static
 dfs-group 1 m-lag 1
#
interface Eth-Trunk1.500 mode l2
 encapsulation dot1q vid 500
 bridge-domain 500
#
interface 10GE1/0/1
 eth-trunk 1
 device transceiver 10GBASE-FIBER
#
interface 10GE1/0/43
 eth-trunk 0
 device transceiver 10GBASE-COPPER
#
interface LoopBack0
 ip address 10.255.254.10 255.255.255.255
#
interface LoopBack1
 ip address 10.1.1.2 255.255.255.252
#
interface Nve1
 source 10.255.254.10
 pip-source 10.1.2.2 peer 10.1.2.1 bypass
 vni 10500 head-end peer-list protocol bgp
 mac-address 0200-fc00-0101
#
ip route-static 10.1.2.1 255.255.255.255 192.168.20.1 preference 1
ip route-static vpn-instance _management_vpn_ 0.0.0.0 0.0.0.0 172.24.0.254
#
snmp-agent
#
lldp enable
#
netconf
#
return
