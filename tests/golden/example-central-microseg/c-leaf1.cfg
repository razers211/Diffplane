traffic-segment enable
traffic-segment default-policy deny
segment behavior GBP-1-2
  statistics enable
segment behavior GBP-3-1
  statistics enable
segment classifier GBP-1-2
  rule 10 permit ipv4 source-segment 1 destination-segment 2 protocol tcp destination-port eq 5432
  rule 20 permit ipv4 source-segment 2 destination-segment 1 protocol tcp source-port eq 5432
segment classifier GBP-3-1
  rule 10 permit ipv4 source-segment 3 destination-segment 1 protocol tcp destination-port eq 22
  rule 20 permit ipv4 source-segment 1 destination-segment 3 protocol tcp source-port eq 22
segment policy FABRIC
  classifier GBP-1-2 behavior GBP-1-2 precedence 1
  classifier GBP-3-1 behavior GBP-3-1 precedence 2
segment-policy FABRIC
dfs-group 1
  authentication-mode hmac-sha256 password dfs-test-key
  dual-active detection source ip 10.20.0.5 peer 10.20.0.6
  priority 150
stp v-stp enable
evpn-overlay enable
ospf 1 router-id 10.20.0.5
  area 0.0.0.0
interface LoopBack0
  ip address 10.20.0.5 255.255.255.255
  ospf enable 1 area 0.0.0.0
interface LoopBack1
  ip address 10.20.1.2 255.255.255.255
  ospf enable 1 area 0.0.0.0
ntp unicast-server 192.0.2.1
ntp unicast-server 192.0.2.2
vlan batch 4093
vlan 4093
  description vxlan-bypass
interface Vlanif4093
  ip address 10.22.0.5 255.255.255.252
  reserved for vxlan bypass
bridge-domain 500
  vxlan vni 10500
  evpn
    route-distinguisher auto
    vpn-target 65002:10500 export-extcommunity
    vpn-target 65002:10500 import-extcommunity
traffic-segment segment-id 3 segment-name web-admins intra-epg-behavior deny
  segment-member mac-address 0200-fc00-0001 bridge-domain 500
interface Eth-Trunk0
  mode lacp-static
  description peer-link to c-leaf2
  peer-link 1
  port vlan exclude 1
interface Eth-Trunk1
  mode lacp-static
  dfs-group 1 m-lag 1
bfd
interface 100GE1/0/1
  undo portswitch
  ip address 10.21.0.10 255.255.255.252
  description to c-spine1 100GE1/0/3
  mtu 9216
  ospf network-type p2p
  ospf enable 1 area 0.0.0.0
  ospf bfd enable
interface 100GE1/0/2
  undo portswitch
  ip address 10.21.0.34 255.255.255.252
  description to c-spine2 100GE1/0/3
  mtu 9216
  ospf network-type p2p
  ospf enable 1 area 0.0.0.0
  ospf bfd enable
interface 100GE1/0/5
  eth-trunk 0
interface 100GE1/0/6
  eth-trunk 0
interface 10GE1/0/1
  eth-trunk 1
interface Nve1
  source 10.20.1.2
  pip-source 10.20.0.5 peer 10.20.0.6 bypass
  mac-address 0200-0a14-0102
  vni 10500 head-end peer-list protocol bgp
ip route-static 10.20.0.6 255.255.255.255 10.22.0.6 preference 1
bgp 65002
  router-id 10.20.0.5
  peer 10.20.0.1 as-number 65002
  peer 10.20.0.2 as-number 65002
  peer 10.20.0.1 connect-interface LoopBack0
  peer 10.20.0.2 connect-interface LoopBack0
  l2vpn-family evpn
    undo policy vpn-target
    peer 10.20.0.1 enable
    peer 10.20.0.2 enable
snmp-agent sys-info version v2c
snmp-agent sys-info location example-central-dc
snmp-agent sys-info contact noc@example.com
snmp-agent sys-info version v3 disable
snmp-agent
interface Eth-Trunk1.500 mode l2
  encapsulation dot1q vid 500
  bridge-domain 500
sysname c-leaf1
