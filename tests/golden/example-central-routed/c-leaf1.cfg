dfs-group 1
  authentication-mode hmac-sha256 password dfs-test-key
  dual-active detection source ip 10.20.0.5 peer 10.20.0.6
  priority 150
stp v-stp enable
evpn-overlay enable
ospf 1 router-id 10.20.0.5
  area 0.0.0.0
interface LoopBack0
  ip address 10.20.0.5 255.255.255.255
  ospf enable 1 area 0.0.0.0
interface LoopBack1
  ip address 10.20.1.2 255.255.255.255
  ospf enable 1 area 0.0.0.0
ntp unicast-server 192.0.2.1
ntp unicast-server 192.0.2.2
vlan batch 4093
vlan 4093
  description vxlan-bypass
interface Vlanif4093
  ip address 10.22.0.5 255.255.255.252
  reserved for vxlan bypass
bridge-domain 500
  vxlan vni 10500
  evpn
    route-distinguisher auto
    vpn-target 65002:10500 export-extcommunity
    vpn-target 65002:10500 import-extcommunity
interface Eth-Trunk0
  mode lacp-static
  description peer-link to c-leaf2
  peer-link 1
  port vlan exclude 1
interface Eth-Trunk1
  mode lacp-static
  dfs-group 1 m-lag 1
bfd
interface 100GE1/0/1
  undo portswitch
  ip address 10.21.0.10 255.255.255.252
  description to c-spine1 100GE1/0/3
  mtu 9216
  ospf network-type p2p
  ospf enable 1 area 0.0.0.0
  ospf bfd enable
interface 100GE1/0/2
  undo portswitch
  ip address 10.21.0.34 255.255.255.252
  description to c-spine2 100GE1/0/3
  mtu 9216
  ospf network-type p2p
  ospf enable 1 area 0.0.0.0
  ospf bfd enable
interface 100GE1/0/5
  eth-trunk 0
interface 100GE1/0/6
  eth-trunk 0
interface 10GE1/0/1
  eth-trunk 1
interface Nve1
  source 10.20.1.2
  pip-source 10.20.0.5 peer 10.20.0.6 bypass
  mac-address 0200-0a14-0102
  vni 10500 head-end peer-list protocol bgp
ip route-static 10.20.0.6 255.255.255.255 10.22.0.6 preference 1
bgp 65002
  router-id 10.20.0.5
  peer 10.20.0.1 as-number 65002
  peer 10.20.0.2 as-number 65002
  peer 10.20.0.1 connect-interface LoopBack0
  peer 10.20.0.2 connect-interface LoopBack0
  l2vpn-family evpn
    undo policy vpn-target
    peer 10.20.0.1 enable
    peer 10.20.0.2 enable
snmp-agent sys-info version v2c
