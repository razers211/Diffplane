dfs-group 1
  authentication-mode hmac-sha256 password dfs-test-key
  dual-active detection source ip 10.20.0.3 peer 10.20.0.4
  priority 150
stp v-stp enable
evpn-overlay enable
ip vpn-instance web-500
  ipv4-family
    route-distinguisher 10.20.0.3:500
ip vpn-instance db-600
  ipv4-family
    route-distinguisher 10.20.0.3:600
ip vpn-instance FW
  ipv4-family
    route-distinguisher 10.20.0.3:3000
ospf 1 router-id 10.20.0.3
  area 0.0.0.0
interface LoopBack0
  ip address 10.20.0.3 255.255.255.255
  ospf enable 1 area 0.0.0.0
interface LoopBack1
  ip address 10.20.1.1 255.255.255.255
  ospf enable 1 area 0.0.0.0
ntp unicast-server 192.0.2.1
ntp unicast-server 192.0.2.2
vlan batch 3000 4093
vlan 4093
  description vxlan-bypass
interface Vlanif4093
  ip address 10.22.0.1 255.255.255.252
  reserved for vxlan bypass
interface Vlanif3000
  ip binding vpn-instance FW
  ip address 10.255.0.1 255.255.255.248
  mac-address 0201-0aff-0003
  m-lag ip address 10.255.0.3 255.255.255.248
bridge-domain 500
  vxlan vni 10500
  evpn
    route-distinguisher auto
    vpn-target 65002:10500 export-extcommunity
    vpn-target 65002:10500 import-extcommunity
bridge-domain 600
  vxlan vni 10600
  evpn
    route-distinguisher auto
    vpn-target 65002:10600 export-extcommunity
    vpn-target 65002:10600 import-extcommunity
interface Vbdif500
  ip binding vpn-instance web-500
  ip address 10.120.0.1 255.255.255.0
  mac-address 0000-5e00-0102
  vxlan anycast-gateway enable
interface Vbdif600
  ip binding vpn-instance db-600
  ip address 10.120.1.1 255.255.255.0
  mac-address 0000-5e00-0102
  vxlan anycast-gateway enable
interface Eth-Trunk0
  mode lacp-static
  description peer-link to c-gw2
  peer-link 1
  port vlan exclude 1
interface Eth-Trunk1
  port link-type trunk
  port trunk allow-pass vlan 3000
  mode lacp-static
  dfs-group 1 m-lag 1
bfd
interface 100GE1/0/1
  undo portswitch
  ip address 10.21.0.2 255.255.255.252
  description to c-spine1 100GE1/0/1
  mtu 9216
  ospf network-type p2p
  ospf enable 1 area 0.0.0.0
  ospf bfd enable
interface 100GE1/0/2
  undo portswitch
  ip address 10.21.0.26 255.255.255.252
  description to c-spine2 100GE1/0/1
  mtu 9216
  ospf network-type p2p
  ospf enable 1 area 0.0.0.0
  ospf bfd enable
interface 100GE1/0/5
  eth-trunk 0
interface 100GE1/0/6
  eth-trunk 0
interface 10GE1/0/1
  eth-trunk 1
interface Nve1
  source 10.20.1.1
  pip-source 10.20.0.3 peer 10.20.0.4 bypass
  mac-address 0200-0a14-0101
  vni 10500 head-end peer-list protocol bgp
  vni 10600 head-end peer-list protocol bgp
ip route-static 10.20.0.4 255.255.255.255 10.22.0.2 preference 1
ip route-static vpn-instance FW 10.120.0.0 255.255.255.0 vpn-instance web-500
ip route-static vpn-instance web-500 0.0.0.0 0.0.0.0 vpn-instance FW 10.255.0.6
ip route-static vpn-instance web-500 10.120.1.0 255.255.255.0 vpn-instance db-600
ip route-static vpn-instance db-600 10.120.0.0 255.255.255.0 vpn-instance web-500
bgp 65002
  router-id 10.20.0.3
  peer 10.20.0.1 as-number 65002
  peer 10.20.0.2 as-number 65002
  peer 10.20.0.1 connect-interface LoopBack0
  peer 10.20.0.2 connect-interface LoopBack0
  vpn-instance FW
    peer 10.255.0.6 as-number 65100
    peer 10.255.0.6 bfd enable
  l2vpn-family evpn
    undo policy vpn-target
    peer 10.20.0.1 enable
    peer 10.20.0.2 enable
  ipv4-family vpn-instance FW
    import-route static
    peer 10.255.0.6 enable
snmp-agent sys-info version v2c
snmp-agent sys-info location example-central-dc
snmp-agent sys-info contact noc@example.com
snmp-agent sys-info version v3 disable
snmp-agent
sysname c-gw1
