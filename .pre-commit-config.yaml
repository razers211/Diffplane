# pip install pre-commit && pre-commit install
# Maintainers: export DIFFPLANE_DENYLIST=<path to the deny-list, outside the repo>.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: denylist
        name: deny-list
        entry: python3 tools/check_denylist.py
        language: system
        types: [text]
